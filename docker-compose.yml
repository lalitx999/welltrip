version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: welltrip_db
    restart: always
    environment:
      POSTGRES_DB: welltrip_prod
      POSTGRES_USER: welltrip_user
      POSTGRES_PASSWORD: welltrip_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welltrip_user -d welltrip_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: welltrip_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: welltrip_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: postgres://welltrip_user:welltrip_secure_password@postgres:5432/welltrip_prod
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: production_super_secret_key_change_in_env
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: welltrip_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://welltrip.community/api/v1
      NEXT_PUBLIC_MEDIA_BASE_URL: https://welltrip.community
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: welltrip_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/usr/share/nginx/html/media:ro
      - backend_static:/usr/share/nginx/html/static:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt

volumes:
  postgres_data:
  backend_media:
  backend_static:
  certbot_etc:
  certbot_var:
