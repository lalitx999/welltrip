[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-vault-inspired-admin"
version = "0.1.0"
description = "An independently implemented green and charcoal Django admin theme"
requires-python = ">=3.10"
dependencies = ["Django>=5.2,<6.1"]

[tool.setuptools.packages.find]
include = ["vault_admin*"]

[tool.setuptools.package-data]
vault_admin = ["templates/admin/*.html", "static/vault_admin/*"]
